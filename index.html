<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai Penggalangku</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
<style>
/* ============================================================
   KEDAI PENGGALANGKU — Design System
   Modern • Realtime • Tanpa dependensi eksternal
   ============================================================ */
:root{
  --bg:#f2f5f9; --panel:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e2e8f0; --line-2:#eef2f7;
  --brand:#0e9f6e; --brand-2:#057a55; --brand-soft:#def7ec;
  --indigo:#4f46e5; --indigo-soft:#eef2ff;
  --amber:#d97706; --amber-soft:#fef3c7;
  --rose:#e02424; --rose-soft:#fde8e8;
  --sky:#0284c7; --sky-soft:#e0f2fe;
  --sidebar:#0b1220; --sidebar-2:#111a2e; --sidebar-ink:#cbd5e1;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.18);
  --shadow-lg:0 24px 60px -24px rgba(15,23,42,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid var(--bg)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));
  color:var(--sidebar-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;
}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#10b981,#0ea5e9);
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px -6px rgba(16,185,129,.6)}
.brand-logo.small{display:none}
.brand-name{font-weight:800;color:#fff;font-size:15px;letter-spacing:.2px}
.brand-sub{font-size:11px;color:#7d8db1}
#nav{padding:14px 12px;display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:none;background:transparent;
  color:var(--sidebar-ink);font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:.15s;
}
.nav-item .ic{width:22px;text-align:center;font-size:15px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(16,185,129,.22),rgba(14,165,233,.14));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(16,185,129,.35)}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;display:flex;flex-direction:column;gap:8px}
.mode-badge{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;font-size:10.5px;letter-spacing:.6px;width:max-content}
.mode-badge.demo{background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b55}
.mode-badge.live{background:#10b98122;color:#34d399;border:1px solid #10b98155}
.sf-date{color:#64748b}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.tb-title{font-size:17px;font-weight:800;letter-spacing:-.2px}
.tb-sub{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.tb-right{display:flex;align-items:center;gap:10px}
#content{padding:22px 24px 60px;max-width:1380px;width:100%;margin:0 auto}
#mobileNav{display:none}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.grow2{grid-column:span 2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card .sub{font-size:11.5px;color:var(--ink-3);margin-bottom:12px}
.section-title{font-size:13px;font-weight:800;color:var(--ink-2);margin:26px 0 12px;text-transform:uppercase;letter-spacing:.8px}

/* ---------- KPI ---------- */
.kpi{position:relative;overflow:hidden}
.kpi .k-ic{position:absolute;right:12px;top:12px;font-size:20px;opacity:.9;width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center}
.kpi .k-label{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px}
.kpi .k-value{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-top:6px;word-break:break-word}
.kpi .k-sub{font-size:11px;color:var(--ink-3);margin-top:4px}
.kpi.emerald .k-ic{background:var(--brand-soft)} .kpi.emerald .k-value{color:var(--brand-2)}
.kpi.indigo  .k-ic{background:var(--indigo-soft)} .kpi.indigo .k-value{color:var(--indigo)}
.kpi.amber   .k-ic{background:var(--amber-soft)} .kpi.amber .k-value{color:var(--amber)}
.kpi.rose    .k-ic{background:var(--rose-soft)} .kpi.rose .k-value{color:var(--rose)}
.kpi.sky     .k-ic{background:var(--sky-soft)} .kpi.sky .k-value{color:var(--sky)}

/* ---------- buttons & forms ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:9px 15px;font-size:13px;font-weight:700;
  color:var(--ink-2);transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:linear-gradient(135deg,var(--brand),#0d9488);color:#fff;border:none;box-shadow:0 6px 16px -6px rgba(14,159,110,.55)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--rose);color:#fff;border:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;outline:none;transition:.15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,159,110,.15)}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.hint{font-size:11.5px;color:var(--ink-3)}
.form-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px}
.tbl th{background:#f8fafc;text-align:left;padding:10px 12px;font-size:10.8px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ink-2);border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafc}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{background:#f8fafc;font-weight:800;border-top:1.5px solid var(--line)}

/* ---------- chips & badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.chip.wajib{background:var(--indigo-soft);color:var(--indigo)}
.chip.pelengkap{background:var(--amber-soft);color:var(--amber)}
.chip.stok{background:var(--brand-soft);color:var(--brand-2)}
.chip.stok.warn{background:var(--amber-soft);color:var(--amber)}
.chip.stok.out{background:var(--rose-soft);color:var(--rose)}
.pill{padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill-mode{background:var(--indigo-soft);color:var(--indigo)}
.pill-pos{background:var(--brand-soft);color:var(--brand-2)}
.pill-neg{background:var(--rose-soft);color:var(--rose)}
.pill-zero{background:#f1f5f9;color:var(--ink-3)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}

/* ---------- flowchart ---------- */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;padding:8px 0}
.flow-node{flex:1;min-width:132px;border-radius:14px;padding:12px 12px 11px;position:relative;border:1.5px solid transparent}
.flow-node .f-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;opacity:.75}
.flow-node .f-value{font-size:15px;font-weight:800;margin-top:4px}
.flow-node .f-pct{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:800;padding:2.5px 8px;border-radius:999px;background:rgba(255,255,255,.65)}
.flow-arrow{display:flex;align-items:center;justify-content:center;width:34px;flex-shrink:0;color:var(--ink-3);font-size:17px;font-weight:800}
.fn-income{background:linear-gradient(135deg,#def7ec,#d1fae5);color:#065f46;border-color:#a7f3d0}
.fn-cost{background:linear-gradient(135deg,#fde8e8,#fee2e2);color:#991b1b;border-color:#fecaca}
.fn-margin{background:linear-gradient(135deg,#e0f2fe,#dbeafe);color:#075985;border-color:#bae6fd}
.fn-final{background:linear-gradient(135deg,#0e9f6e,#0d9488);color:#fff;box-shadow:0 10px 24px -10px rgba(14,159,110,.6)}
.fn-final .f-pct{background:rgba(255,255,255,.25)}
.fn-neg-final{background:linear-gradient(135deg,#e02424,#b91c1c);color:#fff;box-shadow:0 10px 24px -10px rgba(224,36,36,.55)}
.fn-neg-final .f-pct{background:rgba(255,255,255,.25)}

/* ---------- kasir ---------- */
.kasir-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;outline:none;background:#fff}
.search-bar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,159,110,.15)}
.seg{display:inline-flex;background:#e9eef5;border-radius:var(--radius-sm);padding:3px}
.seg button{border:none;background:transparent;padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.14);color:var(--ink)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.15s;position:relative}
.prod-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.prod-card.disabled{opacity:.5;cursor:not-allowed}
.prod-card .p-name{font-weight:700;font-size:13px;line-height:1.3;min-height:34px}
.prod-card .p-price{font-weight:800;color:var(--brand-2);margin-top:7px;font-size:14px}
.prod-card .p-stock{position:absolute;top:10px;right:10px}
.cart-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cart-item:last-child{border-bottom:none}
.cart-item .ci-name{flex:1;font-size:12.5px;font-weight:600;min-width:0}
.cart-item .ci-name small{display:block;color:var(--ink-3);font-weight:400}
.qty-ctrl{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.qty-ctrl button{width:26px;height:26px;border:none;background:#f8fafc;font-weight:800;color:var(--ink-2)}
.qty-ctrl button:hover{background:var(--brand-soft);color:var(--brand-2)}
.qty-ctrl span{width:30px;text-align:center;font-weight:800;font-size:12.5px}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:2px solid var(--line)}
.cart-total .big{font-size:21px;font-weight:800;color:var(--brand-2)}
.pay-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pay-seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.pay-seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2)}

/* ---------- chart helpers ---------- */
.chart-box{width:100%;overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:520px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
.legend .lg-item{display:flex;align-items:center}
.empty-note{padding:26px;text-align:center;color:var(--ink-3);font-size:12.5px}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rank-row:last-child{border-bottom:none}
.rank-row .r-medal{font-size:16px;width:24px;text-align:center}
.rank-row .r-name{flex:1;font-weight:600;font-size:12.8px;min-width:0}
.rank-row .r-name small{display:block;color:var(--ink-3);font-weight:400}
.rank-row .r-val{font-weight:800;font-size:12.8px;text-align:right;white-space:nowrap}
.insight{display:flex;gap:10px;background:linear-gradient(135deg,#f0fdf4,#ecfeff);border:1px solid #bbf7d0;
  border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:12.5px;line-height:1.5}
.insight.amber-bg{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
.insight .i-ic{font-size:17px}

/* ---------- modal & toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);max-width:480px;width:100%;padding:24px;animation:pop .2s}
.modal h3{font-size:16px;margin-bottom:10px}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
#toastRoot{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:slideUp .25s;max-width:340px}
.toast.err{background:#991b1b}.toast.ok{background:#065f46}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

.skel{background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:60px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.receipt-line{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.receipt-line.total{border-top:2px dashed var(--line);margin-top:6px;padding-top:9px;font-weight:800;font-size:15px}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .kasir-layout{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  #sidebar{display:none}
  .brand-logo.small{display:flex;width:38px;height:38px;font-size:18px;border-radius:10px;
    background:linear-gradient(135deg,#10b981,#0ea5e9);align-items:center;justify-content:center}
  #mobileNav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);
    position:sticky;top:67px;z-index:15}
  #mobileNav .nav-item{white-space:nowrap;background:#f1f5f9;color:var(--ink-2);border-radius:999px;padding:8px 14px;width:auto}
  #mobileNav .nav-item.active{background:var(--brand);color:#fff}
  #content{padding:16px 14px 70px}
  #topbar{padding:12px 16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .grow2{grid-column:auto}
  .form-grid{grid-template-columns:1fr}
  .flow-arrow{transform:rotate(90deg);width:100%;height:22px}
  .flow{flex-direction:column}
  .flow-node{min-width:0}
}

</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">🏪</div>
      <div>
        <div class="brand-name">Kedai Penggalangku</div>
        <div class="brand-sub" id="brandSub">Sistem Kasir &amp; Inventaris</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="mode-badge live" id="modeBadge">● LIVE — SPREADSHEET</div>
      <div class="sf-date" id="liveClock"></div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div class="tb-left">
        <div class="brand-logo small">🏪</div>
        <div>
          <div class="tb-title" id="pageTitle">Dashboard</div>
          <div class="tb-sub" id="pageSub"></div>
        </div>
      </div>
      <div class="tb-right">
        <span class="pill pill-mode" id="modePill">🟢 LIVE</span>
        <button class="btn btn-ghost" id="btnRefresh" title="Muat ulang data">⟳ Refresh</button>
      </div>
    </header>
    <nav id="mobileNav"></nav>
    <div id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
/* ============================================================
   util.js — helper umum (format, DOM, waktu)
   ============================================================ */

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_PENDEK = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const PALETTE = ['#0e9f6e','#0284c7','#d97706','#7c3aed','#e02424','#0891b2','#c026d3','#65a30d','#f59e0b','#475569'];

const fmtIDR = n => {
  if (n === null || n === undefined || isNaN(n)) n = 0;
  const neg = n < 0;
  const s = Math.round(Math.abs(n)).toLocaleString('id-ID');
  return (neg ? '−Rp ' : 'Rp ') + s;
};
const fmtNum  = n => (n === null || n === undefined || isNaN(n)) ? '0' : Math.round(n).toLocaleString('id-ID');
const fmtPct  = (n, d = 1) => (n === null || n === undefined || isNaN(n)) ? '0%' : n.toLocaleString('id-ID', {maximumFractionDigits: d}) + '%';
const fmtQty  = n => fmtNum(n) + ' pcs';
const pad2    = n => String(n).padStart(2, '0');
const ymd     = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fmtDate = s => {
  if (!s) return '-';
  const d = new Date(String(s).replace(' ', 'T'));
  if (isNaN(d)) return s;
  return d.getDate() + ' ' + BULAN[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear();
};
const fmtDateTime = s => {
  if (!s) return '-';
  const d = new Date(String(s).replace(' ', 'T'));
  if (isNaN(d)) return s;
  return fmtDate(s) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* DOM kecil: h('div', {class:'x', onclick:fn}, [child, 'text']) */
function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'disabled') el.disabled = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function debounce(fn, ms = 250) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* PRNG deterministik untuk data demo */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function downloadCSV(filename, headers, rows) {
  const escC = v => {
    const s = String(v ?? '');
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(escC).join(';')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs = {}, children = []) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => { if (c) el.appendChild(c); });
  return el;
}

/* ---------- Grafik garis (multi-seri, mendukung null) ----------
   lineChart(container, {
     labels: ['Jan',...],
     series: [{name, values:[num|null], color, fill?}],
     yFmt: v=>...,  height
   }) */
function lineChart(container, { labels, series, yFmt = v => String(Math.round(v)), height = 250, zeroLine = false }) {
  container.innerHTML = '';
  const W = 720, H = height, padL = 52, padR = 16, padT = 18, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;

  const all = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  if (!all.length) {
    container.appendChild(h('div', { class: 'empty-note' }, ['Belum ada data untuk ditampilkan.']));
    return;
  }
  let lo = Math.min(...all, zeroLine ? 0 : Infinity), hi = Math.max(...all, zeroLine ? 0 : -Infinity);
  if (lo === hi) { lo -= 1; hi += 1; }
  const span = hi - lo, pad = span * 0.12;
  lo -= pad; hi += pad;

  const x = i => padL + (labels.length === 1 ? iw / 2 : (i / (labels.length - 1)) * iw);
  const y = v => padT + (1 - (v - lo) / (hi - lo)) * ih;

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}` });

  // grid horizontal
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const v = lo + ((hi - lo) / ticks) * t;
    const yy = y(v);
    svg.appendChild(svgEl('line', { x1: padL, y1: yy, x2: W - padR, y2: yy, stroke: '#eef2f7', 'stroke-width': 1 }));
    svg.appendChild(svgEl('text', { x: padL - 8, y: yy + 3.5, 'text-anchor': 'end', 'font-size': 10, fill: '#94a3b8', text: yFmt(v) }));
  }
  // garis nol bila relevan
  if (lo < 0 && hi > 0) {
    svg.appendChild(svgEl('line', { x1: padL, y1: y(0), x2: W - padR, y2: y(0), stroke: '#cbd5e1', 'stroke-width': 1.2, 'stroke-dasharray': '4 4' }));
  }
  // label sumbu X
  labels.forEach((lb, i) => {
    svg.appendChild(svgEl('text', { x: x(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 10.5, fill: '#64748b', text: lb }));
  });

  series.forEach(s => {
    // area fill opsional
    if (s.fill) {
      let d = '', started = false, firstX = 0, lastX = 0;
      s.values.forEach((v, i) => {
        if (v === null || v === undefined) return;
        if (!started) { d += `M ${x(i)} ${y(v)}`; firstX = x(i); started = true; }
        else d += ` L ${x(i)} ${y(v)}`;
        lastX = x(i);
      });
      if (started) {
        const y0 = y(Math.max(lo, Math.min(hi, 0)));
        d += ` L ${lastX} ${y0} L ${firstX} ${y0} Z`;
        svg.appendChild(svgEl('path', { d, fill: s.color, opacity: 0.10, stroke: 'none' }));
      }
    }
    // garis per segmen (putus di null)
    let seg = [];
    const flush = () => {
      if (seg.length > 1) {
        svg.appendChild(svgEl('polyline', {
          points: seg.map(p => `${p[0]},${p[1]}`).join(' '),
          fill: 'none', stroke: s.color, 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        }));
      }
      seg = [];
    };
    s.values.forEach((v, i) => {
      if (v === null || v === undefined) { flush(); return; }
      seg.push([x(i), y(v)]);
    });
    flush();
    // titik
    s.values.forEach((v, i) => {
      if (v === null || v === undefined) return;
      const c = svgEl('circle', { cx: x(i), cy: y(v), r: 3.4, fill: '#fff', stroke: s.color, 'stroke-width': 2.2 });
      c.appendChild(svgEl('title', { text: `${s.name} — ${labels[i]}: ${yFmt(v)}` }));
      svg.appendChild(c);
    });
  });

  const box = h('div', { class: 'chart-box' }, [svg]);
  container.appendChild(box);
  if (series.length > 1 || series[0].name) {
    container.appendChild(h('div', { class: 'legend' },
      series.map(s => h('span', { class: 'lg-item' }, [
        h('span', { class: 'dot', style: `background:${s.color}` }), s.name,
      ]))));
  }
}

/* ---------- Donut chart ----------
   donut(container, {items:[{label,value,color}], centerTitle, centerValue, size}) */
function donut(container, { items, centerTitle = '', centerValue = '', size = 190 }) {
  container.innerHTML = '';
  const total = items.reduce((a, b) => a + b.value, 0);
  if (!total) { container.appendChild(h('div', { class: 'empty-note' }, ['Belum ada data.'])); return; }
  const cx = size / 2, cy = size / 2, r = size / 2 - 6, thick = 26;
  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}`, style: 'max-width:' + size + 'px;margin:0 auto' });
  let angle = -Math.PI / 2;
  items.forEach(it => {
    const frac = it.value / total;
    const a2 = angle + frac * Math.PI * 2;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx + (r - thick / 2) * Math.cos(angle), y1 = cy + (r - thick / 2) * Math.sin(angle);
    const x2 = cx + (r - thick / 2) * Math.cos(a2 - 0.0001), y2 = cy + (r - thick / 2) * Math.sin(a2 - 0.0001);
    if (frac >= 0.9999) {
      svg.appendChild(svgEl('circle', { cx, cy, r: r - thick / 2, fill: 'none', stroke: it.color, 'stroke-width': thick }));
    } else {
      const p = svgEl('path', {
        d: `M ${x1} ${y1} A ${r - thick / 2} ${r - thick / 2} 0 ${large} 1 ${x2} ${y2}`,
        fill: 'none', stroke: it.color, 'stroke-width': thick,
      });
      p.appendChild(svgEl('title', { text: `${it.label}: ${fmtPct(frac * 100)}` }));
      svg.appendChild(p);
    }
    angle = a2;
  });
  svg.appendChild(svgEl('text', { x: cx, y: cy - 4, 'text-anchor': 'middle', 'font-size': 11, fill: '#64748b', 'font-weight': 700, text: centerTitle }));
  svg.appendChild(svgEl('text', { x: cx, y: cy + 15, 'text-anchor': 'middle', 'font-size': 13.5, fill: '#0f172a', 'font-weight': 800, text: centerValue }));
  const wrap = h('div', { style: 'display:flex;align-items:center;gap:18px;flex-wrap:wrap' }, [svg]);
  wrap.appendChild(h('div', { class: 'legend', style: 'flex:1;min-width:150px;flex-direction:column;align-items:flex-start;gap:6px;display:flex' },
    items.map(it => h('div', { class: 'lg-item', style: 'width:100%;justify-content:space-between;display:flex;gap:8px' }, [
      h('span', {}, [h('span', { class: 'dot', style: `background:${it.color}` }), it.label]),
      h('b', {}, [fmtPct((it.value / total) * 100, 1)]),
    ]))));
  container.appendChild(wrap);
}

/* ---------- Bar horizontal (HTML) ---------- */
function barList(container, rows, { fmt = v => fmtNum(v), color = 'var(--brand)' } = {}) {
  container.innerHTML = '';
  if (!rows.length) { container.appendChild(h('div', { class: 'empty-note' }, ['Belum ada data.'])); return; }
  const max = Math.max(...rows.map(r => r.value), 1);
  rows.forEach(r => {
    container.appendChild(h('div', { style: 'margin-bottom:11px' }, [
      h('div', { style: 'display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px' }, [
        h('span', { style: 'font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%' }, [r.label]),
        h('b', {}, [fmt(r.value)]),
      ]),
      h('div', { style: 'height:9px;background:#eef2f7;border-radius:99px;overflow:hidden' }, [
        h('div', { style: `height:100%;width:${(r.value / max) * 100}%;background:${r.color || color};border-radius:99px;transition:width .5s` }),
      ]),
    ]));
  });
}

   (rumus identik dengan Code.gs di sisi Apps Script)

const SETTINGS_DEFAULT = {
  namaKedai: 'Kedai Penggalangku',
  pembulatan: 500,      // pembulatan harga jual ke atas (Rp)
  potKasPct: 1,         // potongan kas = 1% x harga beli satuan
  potUpahPct: 1.5,      // dasar potongan upah = 1.5%
  potUpahMult: 3,       // potongan upah = 3 x (1.5% x harga beli satuan) = 4.5%
};

/* Hitung komponen harga dari sebuah belanja barang */
function hitungHarga(jumlah, hargaBeliTotal, s) {
  jumlah = Math.max(1, Number(jumlah) || 1);
  const hbs     = hargaBeliTotal / jumlah;
  const potKas  = (s.potKasPct / 100) * hbs;
  const potUpah = s.potUpahMult * ((s.potUpahPct / 100) * hbs);
  const basis   = hbs + potKas + potUpah;
  const inc     = Math.max(1, Number(s.pembulatan) || 500);
  const hjsBulat = Math.ceil(basis / inc) * inc;
  return { hbs, potKas, potUpah, hjsBulat };
}

function parseTgl(s) {
  if (!s) return null;
  const d = new Date(String(s).replace(' ', 'T'));
  return isNaN(d) ? null : d;
}

/* Peta stok per Barang_Id: {dibeli, terjual, sisa} */
function stockMap(db) {
  const map = {};
  db.master.forEach(m => {
    map[m.id] = map[m.id] || { dibeli: 0, terjual: 0 };
    map[m.id].dibeli += Number(m.jumlah) || 0;
  });
  db.transactions.forEach(t => {
    map[t.barangId] = map[t.barangId] || { dibeli: 0, terjual: 0 };
    map[t.barangId].terjual += Number(t.qty) || 0;
  });
  Object.values(map).forEach(v => v.sisa = v.dibeli - v.terjual);
  return map;
}

function itemById(db, id) { return db.master.find(m => m.id === id) || null; }

const monthKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1);

/* ---------- Laporan bulanan (per Barang_Id) ---------- */
function laporanBulan(db, tahun, bulan0) { // bulan0: 0-11
  const akhirBulan = new Date(tahun, bulan0 + 1, 0, 23, 59, 59);
  const rows = [];
  db.master.forEach(m => {
    const tglBeli = parseTgl(m.tanggal);
    if (!tglBeli || tglBeli > akhirBulan) return; // belum ada stok di bulan ini
    let terjualBulan = 0, omzet = 0, potKas = 0, potUpah = 0, terjualSampai = 0;
    db.transactions.forEach(t => {
      if (t.barangId !== m.id) return;
      const d = parseTgl(t.waktu); if (!d) return;
      if (d > akhirBulan) return;
      terjualSampai += t.qty;
      if (d.getMonth() === bulan0 && d.getFullYear() === tahun) {
        terjualBulan += t.qty;
        omzet += t.subtotal;
        potKas += t.potKas;
        potUpah += t.potUpah;
      }
    });
    if (terjualBulan === 0 && (potKas || potUpah) === 0) {
      // tetap tampilkan barang yang sudah distok walau belum laku di bulan itu
    }
    rows.push({
      id: m.id, kategori: m.kategori, nama: m.nama,
      stok: m.jumlah, terjual: terjualBulan, omzet,
      sisa: m.jumlah - terjualSampai,
      potKas, potUpah,
      createdAt: m.createdAt,
    });
  });
  rows.sort((a, b) => b.omzet - a.omzet || b.terjual - a.terjual);
  return rows;
}

/* Bulan-bulan yang punya aktivitas (transaksi atau pengeluaran), terurut naik */
function bulanAktif(db) {
  const set = new Set();
  db.transactions.forEach(t => { const d = parseTgl(t.waktu); if (d) set.add(monthKey(d)); });
  db.expenses.forEach(x => { const d = parseTgl(x.tanggal); if (d) set.add(monthKey(d)); });
  return [...set].sort();
}

/* ---------- Sheet Profit: baris per (bulan x barang) ---------- */
function profitRows(db) {
  const rows = [];
  bulanAktif(db).forEach(key => {
    const [y, m] = key.split('-').map(Number);
    const bulan0 = m - 1;
    const akhirBulan = new Date(y, m, 0, 23, 59, 59);
    const perItem = {};
    db.transactions.forEach(t => {
      const d = parseTgl(t.waktu);
      if (!d || d.getMonth() !== bulan0 || d.getFullYear() !== y) return;
      perItem[t.barangId] = perItem[t.barangId] || { qty: 0 };
      perItem[t.barangId].qty += t.qty;
    });
    Object.entries(perItem).forEach(([id, v]) => {
      const it = itemById(db, id);
      const nama = it ? it.nama : '(barang terhapus)';
      const marginSat = it ? it.margin : 0;
      let terjualSampai = 0;
      db.transactions.forEach(t => {
        if (t.barangId !== id) return;
        const d = parseTgl(t.waktu);
        if (d && d <= akhirBulan) terjualSampai += t.qty;
      });
      const dibeli = it ? it.jumlah : 0;
      rows.push({
        tahun: y, bulan0, bulan: BULAN[bulan0], id, nama,
        terjual: v.qty, sisa: dibeli - terjualSampai,
        marginSat, totalMargin: v.qty * marginSat,
      });
    });
  });
  return rows;
}

/* ---------- Ringkasan per bulan (omzet s/d % laba) ---------- */
function ringkasanBulanan(db) {
  return bulanAktif(db).map(key => {
    const [y, m] = key.split('-').map(Number);
    const bulan0 = m - 1;
    let omzet = 0, hpp = 0, potKas = 0, potUpah = 0;
    db.transactions.forEach(t => {
      const d = parseTgl(t.waktu);
      if (!d || d.getMonth() !== bulan0 || d.getFullYear() !== y) return;
      omzet += t.subtotal;
      hpp += t.qty * (t.hbs || 0);
      potKas += t.potKas;
      potUpah += t.potUpah;
    });
    let pengeluaran = 0;
    db.expenses.forEach(x => {
      const d = parseTgl(x.tanggal);
      if (d && d.getMonth() === bulan0 && d.getFullYear() === y) pengeluaran += Number(x.jumlah) || 0;
    });
    const margin = omzet - hpp;
    const laba = margin - potKas - potUpah - pengeluaran;
    return {
      key, tahun: y, bulan0, bulan: BULAN[bulan0],
      omzet, hpp, margin, potKas, potUpah, pengeluaran,
      laba, pct: omzet > 0 ? (laba / omzet) * 100 : (laba < 0 ? -100 : 0),
    };
  });
}

/* ---------- Agregat dashboard / kesimpulan ---------- */
function dashboardData(db) {
  const ring = ringkasanBulanan(db);
  const stok = stockMap(db);
  const T = { omzet: 0, hpp: 0, margin: 0, potKas: 0, potUpah: 0, pengeluaran: 0, laba: 0, qty: 0 };
  ring.forEach(r => {
    T.omzet += r.omzet; T.hpp += r.hpp; T.margin += r.margin;
    T.potKas += r.potKas; T.potUpah += r.potUpah; T.pengeluaran += r.pengeluaran; T.laba += r.laba;
  });
  db.transactions.forEach(t => T.qty += t.qty);

  // ranking per Barang_Id
  const rank = db.master.map(m => {
    const s = stok[m.id] || { terjual: 0, sisa: 0 };
    let omzet = 0;
    db.transactions.forEach(t => { if (t.barangId === m.id) omzet += t.subtotal; });
    return { id: m.id, nama: m.nama, kategori: m.kategori, terjual: s.terjual, sisa: s.sisa, omzet };
  });
  const top    = [...rank].filter(r => r.terjual > 0).sort((a, b) => b.terjual - a.terjual || b.omzet - a.omzet);
  const bottom = [...rank].sort((a, b) => a.terjual - b.terjual || a.omzet - b.omzet);

  // nilai stok tersisa (harga beli)
  let nilaiStok = 0, qtyStok = 0;
  db.master.forEach(m => {
    const s = stok[m.id]; if (!s) return;
    nilaiStok += Math.max(0, s.sisa) * m.hbs;
    qtyStok += Math.max(0, s.sisa);
  });

  // deret % profit per bulan (tahun aktif terbaru; fallback tahun berjalan)
  const years = ring.map(r => r.tahun);
  const tahunAktif = years.length ? Math.max(...years) : new Date().getFullYear();
  const seriPct = Array.from({ length: 12 }, (_, i) => {
    const r = ring.find(x => x.tahun === tahunAktif && x.bulan0 === i);
    return r ? r.pct : null;
  });
  const seriLaba = Array.from({ length: 12 }, (_, i) => {
    const r = ring.find(x => x.tahun === tahunAktif && x.bulan0 === i);
    return r ? r.laba : null;
  });

  return { ring, stok, total: T, top, bottom, nilaiStok, qtyStok, tahunAktif, seriPct, seriLaba };
}

/* Peringkat persentase: untung/rugi per bulan untuk badge */
function pctBadge(pct) {
  if (pct === null || pct === undefined) return h('span', { class: 'pill pill-zero' }, ['-']);
  const cls = pct > 0 ? 'pill-pos' : pct < 0 ? 'pill-neg' : 'pill-zero';
  const ic = pct > 0 ? '▲ ' : pct < 0 ? '▼ ' : '';
  return h('span', { class: 'pill ' + cls }, [ic + fmtPct(pct)]);
}

function gsCall(fn, data) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : String(e))); })
      [fn](data);
  });
}

const api = {
  async getDb() {
    const r = await gsCall('getInit');
    return r.db;
  },
  async post(action, data = {}) {
    const map = {
      'purchase.add': 'purchaseAdd',
      'sale.checkout': 'saleCheckout',
      'master.update': 'masterUpdate',
      'master.delete': 'masterDelete',
      'trx.update': 'trxUpdate',
      'trx.delete': 'trxDelete',
      'expense.add': 'expenseAdd',
      'expense.update': 'expenseUpdate',
      'expense.delete': 'expenseDelete',
    };
    const fn = map[action];
    if (!fn) throw new Error('Aksi tidak dikenal: ' + action);
    const r = await gsCall(fn, data);
    return { extra: r, db: r.db };
  },
};

function flowNode(label, value, cls, pctText, showSign) {

  return h('div', { class: 'flow-node ' + cls }, [
    h('div', { class: 'f-label' }, [label]),
    h('div', { class: 'f-value' }, [txt]),
    h('div', { class: 'f-pct' }, [pctText]),
  ]);
}

    kpiCard('emerald', '💵', 'Total Omzet', fmtIDR(T.omzet), fmtQty(T.qty) + ' terjual • ' + db.transactions.length + ' transaksi'),

function renderKasir(c, db) {
  const stok = stockMap(db);

  const layout = h('div', { class: 'kasir-layout' });
  const left = h('div');
  const right = h('div', { class: 'card', style: 'position:sticky;top:88px' });

  /* pencarian + filter kategori */
  const searchInput = h('input', { placeholder: '🔍 Cari nama barang atau kode…', value: state.kasirQ || '' });
  searchInput.addEventListener('input', debounce(e => { state.kasirQ = e.target.value; paintGrid(); }, 180));
  const seg = h('div', { class: 'seg' });
  [['all', 'Semua'], ['Atribut Wajib', 'Wajib'], ['Atribut Pelengkap', 'Pelengkap']].forEach(([val, label]) => {
    const b = h('button', { class: (state.kasirKat || 'all') === val ? 'on' : '' }, [label]);
    b.addEventListener('click', () => {
      state.kasirKat = val;
      [...seg.children].forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      paintGrid();
    });
    seg.appendChild(b);
  });

  left.appendChild(h('div', { class: 'search-bar' }, [searchInput, seg]));
  const gridEl = h('div', { class: 'prod-grid' });
  left.appendChild(gridEl);

  right.appendChild(h('h3', {}, ['🛒 Keranjang']));
  right.appendChild(h('div', { class: 'sub' }, ['Klik barang di sebelah untuk menambahkan.']));
  const cartEl = h('div');
  right.appendChild(cartEl);

  function itemsView() {
    let list = db.master.filter(m => (stok[m.id] || {}).sisa > 0 || (state.cart[m.id] || 0) > 0);
    const q = (state.kasirQ || '').toLowerCase();
    if (q) list = list.filter(m => (m.nama + ' ' + m.id).toLowerCase().includes(q));
    if (state.kasirKat && state.kasirKat !== 'all') list = list.filter(m => m.kategori === state.kasirKat);
    return list.sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
  }

  function paintGrid() {
    gridEl.innerHTML = '';
    const list = itemsView();
    if (!list.length) {
      gridEl.appendChild(h('div', { class: 'empty-note', style: 'grid-column:1/-1' }, ['Tidak ada barang yang cocok.']));
      return;
    }
    list.forEach(m => {
      const s = stok[m.id] || { sisa: 0 };
      const inCart = state.cart[m.id] || 0;
      const disabled = s.sisa <= inCart && inCart === 0;
      const chipCls = s.sisa <= 0 ? 'chip stok out' : s.sisa <= 5 ? 'chip stok warn' : 'chip stok';
      const card = h('div', { class: 'prod-card' + (disabled ? ' disabled' : '') }, [
        h('span', { class: 'p-stock ' + chipCls, style: 'position:static' }, [s.sisa <= 0 ? 'Habis' : 'Stok ' + s.sisa]),
        h('div', { class: 'p-name' }, [m.nama]),
        h('div', { style: 'margin-top:5px' }, [h('span', { class: 'chip ' + (m.kategori === 'Atribut Wajib' ? 'wajib' : 'pelengkap') }, [m.kategori.replace('Atribut ', '')])]),
        h('div', { class: 'p-price' }, [fmtIDR(m.hjs)]),
        inCart ? h('div', { style: 'font-size:11px;color:var(--brand-2);font-weight:700;margin-top:3px' }, ['Di keranjang: ' + inCart + ' pcs']) : null,
      ]);
      card.addEventListener('click', () => {
        const cur = state.cart[m.id] || 0;
        if (cur + 1 > s.sisa) { toast('Stok ' + m.nama + ' hanya ' + s.sisa + ' pcs.', 'err'); return; }
        state.cart[m.id] = cur + 1;
        paintGrid(); paintCart();
      });
      gridEl.appendChild(card);
    });
  }

  function cartTotal() {
    let total = 0, n = 0;
    Object.entries(state.cart).forEach(([id, qty]) => {
      const it = db.master.find(m => m.id === id); if (!it) return;
      total += it.hjs * qty; n += qty;
    });
    return { total, n };
  }

  function paintCart() {
    cartEl.innerHTML = '';
    const entries = Object.entries(state.cart).filter(([, q]) => q > 0);
    if (!entries.length) {
      cartEl.appendChild(h('div', { class: 'empty-note' }, ['Keranjang kosong.']));
    }
    entries.forEach(([id, qty]) => {
      const it = db.master.find(m => m.id === id);
      if (!it) { delete state.cart[id]; return; }
      const s = stok[id] || { sisa: 0 };
      cartEl.appendChild(h('div', { class: 'cart-item' }, [
        h('div', { class: 'ci-name' }, [it.nama, h('small', {}, [fmtIDR(it.hjs) + ' / pcs • ' + id])]),
        h('div', { class: 'qty-ctrl' }, [
          h('button', { onclick: () => { if (qty <= 1) delete state.cart[id]; else state.cart[id] = qty - 1; paintGrid(); paintCart(); } }, ['−']),
          h('span', {}, [String(qty)]),
          h('button', { onclick: () => {
            if (qty + 1 > s.sisa) { toast('Stok ' + it.nama + ' hanya ' + s.sisa + ' pcs.', 'err'); return; }
            state.cart[id] = qty + 1; paintGrid(); paintCart();
          } }, ['+']),
        ]),
        h('b', { style: 'min-width:74px;text-align:right;font-size:12.5px' }, [fmtIDR(it.hjs * qty)]),
        h('button', { class: 'btn sm ghost', title: 'Hapus', onclick: () => { delete state.cart[id]; paintGrid(); paintCart(); } }, ['✕']),
      ]));
    });

    const { total, n } = cartTotal();
    cartEl.appendChild(h('div', { class: 'cart-total' }, [
      h('div', {}, [h('div', { style: 'font-size:11px;color:var(--ink-3);font-weight:700' }, ['TOTAL (' + n + ' pcs)']), ]),
      h('div', { class: 'big' }, [fmtIDR(total)]),
    ]));

    const paySeg = h('div', { class: 'pay-seg' });
    ['Tunai', 'QRIS', 'Transfer'].forEach(mtd => {
      const b = h('button', { class: state.payMethod === mtd ? 'on' : '' }, [mtd === 'Tunai' ? '💵 Tunai' : mtd === 'QRIS' ? '📱 QRIS' : '🏦 Transfer']);
      b.addEventListener('click', () => {
        state.payMethod = mtd;
        [...paySeg.children].forEach(x => x.classList.remove('on'));
        b.classList.add('on');
      });
      paySeg.appendChild(b);
    });
    cartEl.appendChild(paySeg);

    const btnPay = h('button', { class: 'btn primary', style: 'width:100%;padding:13px', disabled: !n }, ['💳 Bayar Sekarang — ' + fmtIDR(total)]);
    btnPay.addEventListener('click', () => doCheckout());
    cartEl.appendChild(btnPay);
  }

  async function doCheckout() {
    const items = Object.entries(state.cart).filter(([, q]) => q > 0).map(([id, qty]) => ({ id, qty }));
    if (!items.length) return;
    const { total } = cartTotal();
    confirmModal('Konfirmasi Penjualan',
      items.length + ' jenis barang, total ' + fmtIDR(total) + ' — bayar via ' + state.payMethod + '?',
      async () => {
        try {
          const btn = document.getElementById('btnRefresh');
          const res = await api.post('sale.checkout', { items, metode: state.payMethod });
          state.db = res.db;
          state.cart = {};
          openModal(h('div', { class: 'modal' }, [
            h('h3', {}, ['✅ Penjualan Berhasil']),
            h('div', { style: 'background:#f8fafc;border-radius:12px;padding:14px;margin-top:6px' }, [
              h('div', { class: 'receipt-line' }, [h('span', {}, ['No. Transaksi']), h('b', {}, [res.extra.trxId || '-'])]),
              h('div', { class: 'receipt-line' }, [h('span', {}, ['Metode']), h('b', {}, [state.payMethod])]),
              h('div', { class: 'receipt-line total' }, [h('span', {}, ['Total']), h('span', {}, [fmtIDR(total)])]),
              h('div', { class: 'hint', style: 'margin-top:8px' }, ['Sheet laporan bulan ' + BULAN[new Date().getMonth()] + ' otomatis diperbarui di spreadsheet.']),
            ]),
            h('div', { class: 'm-actions' }, [h('button', { class: 'btn primary', onclick: () => closeModal() }, ['Selesai'])]),
          ]));
          paintGrid(); paintCart();
          renderNav(); // badge mode tetap; cukup refresh tampilan lain saat pindah halaman
        } catch (e) {
          toast(e.message || 'Transaksi gagal.', 'err');
        }
      }, 'Ya, proses pembayaran');
  }

  paintGrid(); paintCart();
  layout.append(left, right);
  c.appendChild(layout);
}

/* ---------------- BELANJA / STOK MASUK (TAMBAH) ---------------- */
function renderBelanja(c, db) {
  const s = db.settings;
  const card = h('div', { class: 'card' }, [
    h('h3', {}, ['📦 Catat Belanja Barang (Tambah)']),
    h('div', { class: 'sub' }, ['Isi data sederhana di bawah — harga satuan, potongan, dan harga jual dihitung otomatis.']),
  ]);

  const fNama = h('input', { placeholder: 'cth: Hasduk / Scarf Merah Putih' });
  const fKat = h('select', {}, [
    h('option', { value: 'Atribut Wajib' }, ['Atribut Wajib']),
    h('option', { value: 'Atribut Pelengkap' }, ['Atribut Pelengkap']),
  ]);
  const fTgl = h('input', { type: 'date', value: ymd(new Date()) });
  const fLokasi = h('input', { placeholder: 'cth: Pasar Klewer' });
  const fJumlah = h('input', { type: 'number', min: 1, placeholder: '0' });
  const fTotal = h('input', { type: 'number', min: 0, placeholder: '0' });

  const prevBox = h('div', { style: 'background:#f8fafc;border:1.5px dashed var(--line);border-radius:12px;padding:14px;margin-top:4px' });

  function preview() {
    const jumlah = Number(fJumlah.value) || 0;
    const total = Number(fTotal.value) || 0;
    prevBox.innerHTML = '';
    if (jumlah <= 0 || total <= 0) {
      prevBox.appendChild(h('div', { class: 'hint' }, ['Isi jumlah & harga beli total untuk melihat hitungan otomatis.']));
      return;
    }
    const calc = hitungHarga(jumlah, total, s);
    const rows = [
      ['Harga beli satuan', fmtIDR(calc.hbs)],
      ['Potongan Kas (1%)', fmtIDR(calc.potKas) + ' /pcs'],
      ['Potongan Upah (3 × 1,5%)', fmtIDR(calc.potUpah) + ' /pcs'],
      ['Harga jual satuan (dibulatkan ↑ kelipatan ' + fmtNum(s.pembulatan) + ')', h('b', { style: 'color:var(--brand-2)' }, [fmtIDR(calc.hjsBulat)])],
      ['Margin / pcs', fmtIDR(calc.hjsBulat - calc.hbs)],
    ];
    rows.forEach(([l, v]) => prevBox.appendChild(h('div', { class: 'receipt-line' }, [h('span', {}, [l]), typeof v === 'string' ? h('b', {}, [v]) : v])));
  }
  fJumlah.addEventListener('input', preview);
  fTotal.addEventListener('input', preview);
  preview();

  card.appendChild(h('div', { class: 'form-grid' }, [
    fieldBox('Nama Barang *', fNama),
    fieldBox('Kode Barang (Kategori)', fKat),
    fieldBox('Tanggal Belanja', fTgl),
    fieldBox('Lokasi Beli', fLokasi),
    fieldBox('Jumlah Barang Dibeli (pcs) *', fJumlah),
    fieldBox('Harga Beli Total (Rp) *', fTotal),
  ]));
  card.appendChild(prevBox);

  const btn = h('button', { class: 'btn primary', style: 'margin-top:14px' }, ['💾 Simpan ke Data Master']);
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const res = await api.post('purchase.add', {
        nama: fNama.value, kategori: fKat.value, tanggal: fTgl.value,
        lokasi: fLokasi.value, jumlah: fJumlah.value, hargaBeli: fTotal.value,
      });
      state.db = res.db;
      toast('Barang ' + res.extra.row.id + ' tersimpan di Data Master.');
      navigate('master');
    } catch (e) { toast(e.message || 'Gagal menyimpan.', 'err'); }
    btn.disabled = false;
  });
  card.appendChild(btn);
  c.appendChild(card);

function openMasterEdit(m, s) {
  const fNama = h('input', { value: m.nama });
  const fKat = h('select', {}, [
    h('option', { value: 'Atribut Wajib', selected: m.kategori === 'Atribut Wajib' }, ['Atribut Wajib']),
    h('option', { value: 'Atribut Pelengkap', selected: m.kategori !== 'Atribut Wajib' }, ['Atribut Pelengkap']),
  ]);
  const fTgl = h('input', { type: 'date', value: String(m.tanggal || '').slice(0, 10) });
  const fLokasi = h('input', { value: m.lokasi });
  const fJumlah = h('input', { type: 'number', min: 1, value: m.jumlah });
  const fBeli = h('input', { type: 'number', min: 1, value: Math.round(m.hargaBeli) });
  const fJual = h('input', { type: 'number', min: 1, value: Math.round(m.hjs) });
  const prev = h('div', { style: 'background:#f8fafc;border-radius:10px;padding:11px;margin-top:4px;font-size:12.5px' });

  function paint() {
    prev.innerHTML = '';
    const jumlah = Number(fJumlah.value) || 0;
    const total = Number(fBeli.value) || 0;
    if (jumlah <= 0 || total <= 0) { prev.appendChild(h('span', { class: 'hint' }, ['Lengkapi jumlah & harga beli.'])); return; }
    const calc = hitungHarga(jumlah, total, s);
    const jual = Number(fJual.value) || 0;
    prev.append(
      'HBS ' + fmtIDR(calc.hbs) + ' • Pot. kas ' + fmtIDR(calc.potKas) + ' • Pot. upah ' + fmtIDR(calc.potUpah) +
      ' • Jual bulat ' + fmtIDR(calc.hjsBulat) + ' • Margin ' + fmtIDR(jual - calc.hbs)
    );
  }
  [fJumlah, fBeli, fJual].forEach(el => el.addEventListener('input', paint));
  paint();

  const btnAuto = h('button', { class: 'btn sm', type: 'button' }, ['✨ Pakai harga otomatis']);
  btnAuto.addEventListener('click', () => {
    const calc = hitungHarga(Number(fJumlah.value) || 1, Number(fBeli.value) || 0, s);
    fJual.value = Math.round(calc.hjsBulat);
    paint();
  });

  const btnSave = h('button', { class: 'btn primary' }, ['💾 Simpan Perubahan']);
  btnSave.addEventListener('click', async () => {
    btnSave.disabled = true;
    try {
      const res = await api.post('master.update', {
        id: m.id, nama: fNama.value, kategori: fKat.value, tanggal: fTgl.value, lokasi: fLokasi.value,
        jumlah: fJumlah.value, hargaBeli: fBeli.value, hargaJualSatuan: fJual.value,
      });
      state.db = res.db;
      toast('Barang ' + m.id + ' diperbarui, laporan dihitung ulang.');
      closeModal(); refreshPage();
    } catch (e) { toast(e.message || 'Gagal memperbarui.', 'err'); }
    btnSave.disabled = false;
  });

  openModal(h('div', { class: 'modal' }, [
    h('h3', {}, ['✏️ Edit Barang — ' + m.id]),
    h('div', { class: 'form-grid', style: 'grid-template-columns:1fr 1fr' }, [
      fieldBox('Nama Barang', fNama),
      fieldBox('Kode Barang (Kategori)', fKat),
      fieldBox('Tanggal Belanja', fTgl),
      fieldBox('Lokasi Beli', fLokasi),
      fieldBox('Jumlah Dibeli (pcs)', fJumlah),
      fieldBox('Harga Beli Total (Rp)', fBeli),
    ]),
    h('div', { class: 'field' }, [h('label', {}, ['Harga Jual Satuan (Rp)']), fJual]),
    h('div', { class: 'form-row' }, [btnAuto, h('span', { class: 'hint' }, ['Potongan & margin dihitung ulang otomatis.'])]),
    prev,
    h('div', { class: 'm-actions' }, [
      h('button', { class: 'btn', onclick: () => closeModal() }, ['Batal']), btnSave,
    ]),
  ]));
}

  ]);

      const btnD = h('button', { class: 'btn sm ghost', title: 'Hapus transaksi' }, ['🗑']);
      btnD.addEventListener('click', () => confirmModal('Hapus transaksi?',
        t.trxId + ' — ' + t.nama + ' (' + t.qty + ' pcs) akan dihapus. Stok barang otomatis kembali dan laporan bulanan dihitung ulang.',
        async () => {
          try {
            const res = await api.post('trx.delete', { trxId: t.trxId, barangId: t.barangId });
            state.db = res.db; toast('Transaksi dihapus, stok kembali.'); refreshPage();
          } catch (e) { toast(e.message || 'Gagal menghapus.', 'err'); }
        }, 'Hapus', true));
      tb.appendChild(h('tr', {}, [
        h('td', {}, [t.trxId]), h('td', {}, [fmtDateTime(t.waktu)]), h('td', {}, [t.nama, h('div', { class: 'hint' }, [t.barangId])]),
        h('td', { class: 'num' }, [fmtNum(t.qty)]), h('td', { class: 'num' }, [fmtIDR(t.harga)]),
        h('td', { class: 'num' }, [h('b', {}, [fmtIDR(t.subtotal)])]),
        h('td', { class: 'num' }, [fmtIDR(t.potKas)]), h('td', { class: 'num' }, [fmtIDR(t.potUpah)]),
        h('td', {}, [t.metode]),
        h('td', {}, [h('div', { style: 'display:flex;gap:5px' }, [btnE, btnD])]),
      ]));
    });
    tbl.appendChild(tb);
    tbl.appendChild(h('tfoot', {}, [h('tr', {}, [
      h('td', {}, ['TOTAL (' + rows.length + ' baris)']), h('td'), h('td'),
      h('td', { class: 'num' }, [fmtNum(tQ)]), h('td'), h('td', { class: 'num' }, [fmtIDR(tO)]),
      h('td'), h('td'), h('td'), h('td'),
    ])]));
    wrap.appendChild(tbl);
  }
  paint();
  c.appendChild(card);
}

/* ---------------- LAPORAN BULANAN ---------------- */
function renderLaporan(c, db) {
  const card = h('div', { class: 'card' }, [
    h('h3', {}, ['📅 Laporan Bulanan']),
    h('div', { class: 'sub' }, ['Sesuai sheet Lap-<Bulan> di spreadsheet: sheet bulan dibuat otomatis saat transaksi pertama bulan itu terjadi. 🔒 Baca-saja — data dihitung otomatis; koreksi dilakukan lewat menu Transaksi / Belanja.']),
  ]);

  const now = new Date();
  const avail = [...new Set(db.transactions.map(t => String(t.waktu).slice(0, 7)))].sort();
  const selY = h('select'), selM = h('select');
  const years = [...new Set(avail.map(k => k.slice(0, 4)))];
  if (!years.length) years.push(String(now.getFullYear()));
  const defY = state.lapY || String(Math.max(...years.map(Number)));
  years.forEach(y => selY.appendChild(h('option', { value: y, selected: y === defY }, [y])));
  BULAN.forEach((b, i) => {
    const val = String(i);
    const defM = state.lapM !== undefined ? String(state.lapM) : String(now.getMonth());
    selM.appendChild(h('option', { value: val, selected: val === defM }, [b]));
  });
  [selY, selM].forEach(s => { s.style.border = '1.5px solid var(--line)'; s.style.borderRadius = '10px'; s.style.padding = '9px 12px'; });

  const body = h('div');
  function paint() {
    state.lapY = selY.value; state.lapM = Number(selM.value);
    body.innerHTML = '';
    const rows = laporanBulan(db, Number(selY.value), Number(selM.value));
    if (!rows.length) {
      body.appendChild(h('div', { class: 'empty-note' }, ['Belum ada aktivitas stok/penjualan di bulan ini. Sheet bulan akan dibuat otomatis saat transaksi pertama.']));
      return;
    }
    const wrap = h('div', { class: 'tbl-wrap' });
    const tbl = h('table', { class: 'tbl' });
    tbl.appendChild(h('thead', {}, [h('tr', {}, [
      h('th', {}, ['Barang_Id']), h('th', {}, ['Kode Barang']), h('th', {}, ['Nama Barang']),
      h('th', { class: 'num' }, ['Jumlah Stok']), h('th', { class: 'num' }, ['Jumlah Terjual']),
      h('th', { class: 'num' }, ['Harga Bayar']), h('th', { class: 'num' }, ['Sisa Stok']),
      h('th', { class: 'num' }, ['Jml Pot. Kas']), h('th', { class: 'num' }, ['Jml Pot. Upah']), h('th', {}, ['Created At']),
    ])]));
    const tb = h('tbody');
    let tStok = 0, tJual = 0, tOmzet = 0, tSisa = 0, tKas = 0, tUpah = 0;
    rows.forEach(r => {
      tStok += r.stok; tJual += r.terjual; tOmzet += r.omzet; tSisa += Math.max(0, r.sisa); tKas += r.potKas; tUpah += r.potUpah;
      tb.appendChild(h('tr', {}, [
        h('td', {}, [h('b', {}, [r.id])]),
        h('td', {}, [h('span', { class: 'chip ' + (r.kategori === 'Atribut Wajib' ? 'wajib' : 'pelengkap') }, [r.kategori.replace('Atribut ', '')])]),
        h('td', {}, [r.nama]),
        h('td', { class: 'num' }, [fmtNum(r.stok)]),
        h('td', { class: 'num' }, [h('b', {}, [fmtNum(r.terjual)])]),
        h('td', { class: 'num' }, [fmtIDR(r.omzet)]),
        h('td', { class: 'num' }, [fmtNum(r.sisa)]),
        h('td', { class: 'num' }, [fmtIDR(r.potKas)]),
        h('td', { class: 'num' }, [fmtIDR(r.potUpah)]),
        h('td', {}, [fmtDateTime(r.createdAt)]),
      ]));
    });
    tbl.appendChild(tb);
    tbl.appendChild(h('tfoot', {}, [h('tr', {}, [
      h('td', {}, ['TOTAL']), h('td'), h('td'),
      h('td', { class: 'num' }, [fmtNum(tStok)]), h('td', { class: 'num' }, [fmtNum(tJual)]),
      h('td', { class: 'num' }, [fmtIDR(tOmzet)]), h('td', { class: 'num' }, [fmtNum(tSisa)]),
      h('td', { class: 'num' }, [fmtIDR(tKas)]), h('td', { class: 'num' }, [fmtIDR(tUpah)]), h('td'),
    ])]));
    wrap.appendChild(tbl);
    body.appendChild(wrap);

    const btnCSV = h('button', { class: 'btn', style: 'margin-top:12px' }, ['⬇️ Unduh CSV']);
    btnCSV.addEventListener('click', () => downloadCSV(
      'Laporan-' + BULAN[Number(selM.value)] + '-' + selY.value + '.csv',
      ['Barang_Id', 'Kode Barang', 'Nama Barang', 'Jumlah Stok', 'Jumlah Terjual', 'Harga Bayar', 'Sisa Stok', 'Jumlah Potongan Kas', 'Jumlah Potongan Upah', 'Created At'],
      rows.map(r => [r.id, r.kategori, r.nama, r.stok, r.terjual, Math.round(r.omzet), r.sisa, Math.round(r.potKas), Math.round(r.potUpah), r.createdAt])
    ));
    body.appendChild(btnCSV);
  }
  selY.addEventListener('change', paint);
  selM.addEventListener('change', paint);

  card.appendChild(h('div', { class: 'form-row', style: 'margin-bottom:14px' }, [
    h('label', { style: 'font-weight:700;font-size:12px;color:var(--ink-2)' }, ['Bulan:']), selM, selY,
  ]));
  card.appendChild(body);
  paint();
  c.appendChild(card);
}

/* ---------------- PROFIT ---------------- */
function renderProfit(c, db) {
  const rows = profitRows(db);
  const card = h('div', { class: 'card' }, [
    h('h3', {}, ['📈 Sheet Profit — Rekapan per Bulan']),
    h('div', { class: 'sub' }, ['Margin = harga jual satuan − harga beli satuan. Total margin dihitung dari jumlah terjual. 🔒 Baca-saja — koreksi lewat menu Transaksi.']),
  ]);
  if (!rows.length) {
    card.appendChild(h('div', { class: 'empty-note' }, ['Belum ada penjualan.']));
    c.appendChild(card); return;
  }

  const wrap = h('div', { class: 'tbl-wrap' });
  const tbl = h('table', { class: 'tbl' });
  tbl.appendChild(h('thead', {}, [h('tr', {}, [
    h('th', {}, ['Nama Bulan']), h('th', {}, ['Barang_Id']), h('th', {}, ['Nama Barang']),
    h('th', { class: 'num' }, ['Jumlah Stok Terjual']), h('th', { class: 'num' }, ['Sisa Stok']),
    h('th', { class: 'num' }, ['Margin Satuan']), h('th', { class: 'num' }, ['Total Margin']),
  ])]));
  const tb = h('tbody');
  let lastKey = null, grand = 0;
  rows.forEach(r => {
    const key = r.tahun + '-' + r.bulan0;
    if (lastKey !== key) {
      tb.appendChild(h('tr', {}, [h('td', { colspan: 7, style: 'background:#f1f5f9;font-weight:800' }, ['— ' + r.bulan + ' ' + r.tahun + ' —'])]));
      lastKey = key;
    }
    grand += r.totalMargin;
    tb.appendChild(h('tr', {}, [
      h('td', {}, [r.bulan + ' ' + r.tahun]), h('td', {}, [r.id]), h('td', {}, [r.nama]),
      h('td', { class: 'num' }, [fmtNum(r.terjual)]), h('td', { class: 'num' }, [fmtNum(r.sisa)]),
      h('td', { class: 'num' }, [fmtIDR(r.marginSat)]),
      h('td', { class: 'num' }, [h('b', {}, [fmtIDR(r.totalMargin)])]),
    ]));
  });
  tbl.appendChild(tb);
  tbl.appendChild(h('tfoot', {}, [h('tr', {}, [
    h('td', {}, ['TOTAL MARGIN KOTOR']), h('td'), h('td'), h('td'), h('td'), h('td'),
    h('td', { class: 'num' }, [fmtIDR(grand)]),
  ])]));
  wrap.appendChild(tbl);
  card.appendChild(wrap);

  const btnCSV = h('button', { class: 'btn', style: 'margin-top:12px' }, ['⬇️ Unduh CSV']);
  btnCSV.addEventListener('click', () => downloadCSV('Profit.csv',
    ['Nama Bulan', 'Tahun', 'Barang_Id', 'Nama Barang', 'Jumlah Stok Terjual', 'Sisa Stok', 'Margin Satuan', 'Total Margin'],
    rows.map(r => [r.bulan, r.tahun, r.id, r.nama, r.terjual, r.sisa, Math.round(r.marginSat), Math.round(r.totalMargin)])));
  card.appendChild(btnCSV);
  c.appendChild(card);
}

/* ============================================================
   app.js — router, navigasi, boot, realtime refresh
   ============================================================ */

const PAGES = {
  dashboard:  { ic: '📊', label: 'Dashboard',        sub: 'Kesimpulan, flowchart & grafik realtime', render: renderDashboard },
  kasir:      { ic: '🛒', label: 'Kasir',            sub: 'Catat penjualan — stok & laporan ter-update langsung', render: renderKasir },
  belanja:    { ic: '📦', label: 'Belanja / Stok',   sub: 'Catat belanja barang masuk ke Data Master', render: renderBelanja },
  master:     { ic: '🗂️', label: 'Master Data',      sub: 'Sheet DataMaster — kelola barang & harga jual', render: renderMaster },
  transaksi:  { ic: '🧾', label: 'Transaksi',        sub: 'Riwayat penjualan (TransaksiPenjualan)', render: renderTransaksi },
  pengeluaran:{ ic: '💸', label: 'Pengeluaran',      sub: 'Biaya lain-lain di luar kas & upah', render: renderPengeluaran },
  laporan:    { ic: '📅', label: 'Laporan Bulanan',  sub: 'Sheet Lap-<Bulan> — dibuat otomatis per bulan', render: renderLaporan },
  profit:     { ic: '📈', label: 'Profit',           sub: 'Rekapan margin tiap bulan', render: renderProfit },
};

const state = {
  page: 'dashboard', db: null, cart: {}, payMethod: 'Tunai',
  kasirQ: '', kasirKat: 'all', trxFilter: 'all', lapY: null, lapM: undefined,
};

function renderNav() {
  const nav = document.getElementById('nav');
  const mnav = document.getElementById('mobileNav');
  nav.innerHTML = ''; mnav.innerHTML = '';
  Object.entries(PAGES).forEach(([key, p]) => {
    [nav, mnav].forEach(target => {
      const b = h('button', { class: 'nav-item' + (state.page === key ? ' active' : '') }, [
        h('span', { class: 'ic' }, [p.ic]), h('span', {}, [p.label]),
      ]);
      b.addEventListener('click', () => navigate(key));
      target.appendChild(b);
    });
  });
}

function navigate(page) {
  state.page = page;
  renderNav();
  refreshPage();
  window.scrollTo({ top: 0 });
}

function refreshPage() {
  if (!state.db) return;
  const c = document.getElementById('content');
  c.innerHTML = '';
  document.getElementById('pageTitle').textContent = PAGES[state.page].label;
  document.getElementById('pageSub').textContent = PAGES[state.page].sub;
  PAGES[state.page].render(c, state.db);
}

function updateModeUI() {
  if (state.db) {
    document.getElementById('brandSub').textContent =
      (state.db.settings.namaKedai || 'Kedai Penggalangku') + ' • Realtime Spreadsheet';
  }
}

async function bootLoad() {
  try {
    state.db = await api.getDb();
    updateModeUI();
    refreshPage();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="empty-note">⚠️ Gagal memuat data: ' + esc(e.message) +
      '<br><br><button class="btn primary" onclick="location.reload()">Coba Lagi</button></div></div>';
  }
}

/* jam realtime */
function tickClock() {
  const el = document.getElementById('liveClock');
  if (!el) return;
  const d = new Date();
  el.textContent = HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear() +
    ' • ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}

/* init */
(async function boot() {
  renderNav();
  tickClock();
  setInterval(tickClock, 1000);

  const content = document.getElementById('content');
  content.innerHTML = '<div class="grid g4">' + Array.from({ length: 8 }).map(() => '<div class="skel"></div>').join('') + '</div>';

  await bootLoad();

  document.getElementById('btnRefresh').addEventListener('click', async () => {
    const b = document.getElementById('btnRefresh');
    b.disabled = true;
    await bootLoad();
    toast('Data dimuat ulang.');
    b.disabled = false;
  });

  // realtime: polling ringan tiap 30 detik
  setInterval(async () => {
    if (document.hidden) return;
    if (state.page !== 'dashboard' && state.page !== 'transaksi' && state.page !== 'laporan') return;
    if (Object.keys(state.cart).length) return; // jangan ganggu kasir yang sedang aktif
    try { state.db = await api.getDb(); refreshPage(); } catch (e) {}
  }, 30000);
})();

</script>
